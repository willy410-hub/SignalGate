[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sgate-eval"
version = "0.1.0"
description = "SignalGate: a reference implementation of a research-signal quality gate for AI evaluation and data design."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scipy>=1.11", "pydantic>=2.5"]

[project.scripts]
sgate = "sgate_eval.cli:main"

[project.optional-dependencies]
rl = ["gymnasium>=0.29", "torch>=2.2"]
viz = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
